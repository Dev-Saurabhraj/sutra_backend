name: sutra

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sutra
      POSTGRES_PASSWORD: sutra
      POSTGRES_DB: sutra
    ports:
      - "5433:5432" # 5433 on the host so a local Postgres on 5432 doesn't clash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutra -d sutra"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://sutra:sutra@db:5432/sutra?schema=public
    ports:
      - "4000:4000"
    # Apply the schema on start; seeding is a separate, explicit step (see README).
    command: sh -c "npx prisma db push --skip-generate && node dist/server.js"

volumes:
  pgdata:
